name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ═══════════════════════════════════════════
  # JOB 1 : Tests unitaires
  # ═══════════════════════════════════════════
  test:
    name: Tests unitaires
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
      
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Lancer les tests unitaires
        run: pytest tests/ -v --cov=pipeline
      
      - name: Vérifier la syntaxe Python
        run: python -m py_compile pipeline/*.py api/*.py dashboard/*.py

  # ═══════════════════════════════════════════
  # JOB 2 : Build Docker Image
  # ═══════════════════════════════════════════
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: |
            anomalie-detection:${{ github.sha }}
            anomalie-detection:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max